[metadata]
name = PhenGO
version = 0.1.2
license_file = LICENSE
author = Nicholas Dimonaco
author_email = nicholas@dimonaco.co.uk
description = PhenoGO: A tool to build WEKA-ready ARFF files from model organism phenotype and Gene Ontology (GO) annotations.
keywords = phenotype, gene ontology, GO, WEKA, ARFF, machine learning, model organism
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/NickJD/PhenoGO
project_urls =
    Bug Tracker = https://github.com/NickJD/PhenoGO/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: OS Independent

[options]
include_package_data = True
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =
    networkx

[options.packages.find]
where = src
include =
    PhenGO
    PhenGO.*

[options.package_data]
PhenGO =
    data/worm/lethal_terms_traversed_2025-08-12.tsv.gz
    data/worm/genes_direct_and_inferred_for_WBPhenotype_0000062_11-08-2025.txt.gz
    data/mouse/MGI_lethal_terms.tsv.gz
    data/fly/FlyBase_Fields_2017.txt.gz
    data/fly/FlyBase_Helper_Lines_2025-08-15.txt.gz

[options.entry_points]
console_scripts =
    PhenGO          = PhenGO.core.PhenGO:main
    phengo          = PhenGO.core.PhenGO:main
    PhenGO-predict  = PhenGO.predict.cli:main
    phengo-predict  = PhenGO.predict.cli:main
    compare-arff    = PhenGO.scripts.compare_arff_genes:main
    compare_arff    = PhenGO.scripts.compare_arff_genes:main
    phengo-tools    = PhenGO.scripts.tools:main
