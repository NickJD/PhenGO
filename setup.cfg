[metadata]
name = PhenGO
version = 0.2.0
license_file = LICENSE
author = Nicholas Dimonaco
author_email = nicholas@dimonaco.co.uk
description = PhenGO: A tool to build WEKA-ready ARFF files from model organism phenotype and Gene Ontology (GO) annotations.
keywords = phenotype, gene ontology, GO, WEKA, ARFF, machine learning, model organism
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/NickJD/PhenoGO
project_urls =
    Bug Tracker = https://github.com/NickJD/PhenoGO/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: OS Independent

[options]
include_package_data = True
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    networkx

[options.extras_require]
predict =
    numpy
    pandas
    scikit-learn
    matplotlib
nn =
    tensorflow
reports =
    numpy
    pandas
    scikit-learn
    matplotlib
    seaborn
all =
    numpy
    pandas
    scikit-learn
    matplotlib
    seaborn
    tensorflow

[options.packages.find]
where = src
include =
    PhenGO
    PhenGO.*

[options.package_data]
PhenGO =
    data/worm/lethal_terms_traversed_2025-08-12.tsv.gz
    data/worm/genes_direct_and_inferred_for_WBPhenotype_0000062_11-08-2025.txt.gz
    data/mouse/mouse_lethal_terms.txt.gz
    data/fly/FlyBase_Fields_2025_07_29.tsv.gz
    data/fly/FlyBase_Fields_2017.tsv.gz
    data/fly/FlyBase_Lethal_Gene_IDs_2025-08-15.txt.gz
    data/fly/FlyBase_Helper_Lines_2025-08-15.txt.gz

[options.entry_points]
console_scripts =
    PhenGO          = PhenGO.core.PhenGO:main
    phengo          = PhenGO.core.PhenGO:main
    PhenGO-predict  = PhenGO.predict.cli:main
    phengo-predict  = PhenGO.predict.cli:main
    compare-arff    = PhenGO.scripts.compare_arff_genes:main
    compare_arff    = PhenGO.scripts.compare_arff_genes:main
    phengo-tools    = PhenGO.scripts.tools:main
    predict-report  = PhenGO.scripts.predict_report:main
    phengo-report   = PhenGO.scripts.report_generator:main
    temporal-analysis = PhenGO.scripts.GO_temporal_analysis:main
    phengo-version-sensitivity = PhenGO.predict.version_sensitivity:main
    version-sensitivity = PhenGO.predict.version_sensitivity:main
